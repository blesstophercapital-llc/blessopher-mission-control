<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maintane Mission Control</title>
<style>
:root{--green:#3B5C3A;--cream:#FAF6F0;--tan:#C4A882;--bark:#2C2417;--paper:#F5F1EA;--ink:#171411;--muted:#746B60;--line:#E4D9CA;--red:#C84636;--amber:#B97818;--blue:#2E6B9A;--ok:#1B8754}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}.app{display:flex;min-height:100vh}.sidebar{width:236px;background:var(--bark);color:var(--cream);display:flex;flex-direction:column;flex-shrink:0}.logo{padding:24px 20px;border-bottom:1px solid rgba(250,246,240,.12)}.brand{font-weight:800;letter-spacing:-.03em;font-size:18px}.brand span{color:var(--tan)}.sub{font-size:12px;color:rgba(250,246,240,.55);margin-top:4px}.nav{padding:16px 0;flex:1}.nav-label{padding:0 20px;margin:18px 0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:rgba(250,246,240,.45);font-weight:800}.nav-item{padding:10px 20px;border-left:3px solid transparent;color:rgba(250,246,240,.68);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px}.nav-item:hover,.nav-item.active{background:rgba(250,246,240,.07);color:var(--cream);border-left-color:var(--tan)}.side-foot{padding:18px 20px;border-top:1px solid rgba(250,246,240,.12);font-size:12px;color:rgba(250,246,240,.6)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#58D68D;margin-right:8px;box-shadow:0 0 0 5px rgba(88,214,141,.12)}.main{flex:1;min-width:0}.topbar{height:64px;background:rgba(250,246,240,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.title{font-size:18px;font-weight:800;letter-spacing:-.02em}.top-actions{display:flex;gap:10px;align-items:center}.pill{font-size:12px;border:1px solid var(--line);background:#fff8;padding:7px 11px;border-radius:999px;color:var(--muted)}button,.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 12px;color:var(--ink);font-weight:700;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}button.primary,.btn.primary{background:var(--green);border-color:var(--green);color:var(--cream)}button:hover,.btn:hover{transform:translateY(-1px)}.content{padding:28px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(135deg,var(--green),#284227);border-radius:22px;color:var(--cream);padding:26px;margin-bottom:18px;display:grid;grid-template-columns:1.4fr .8fr;gap:20px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(196,168,130,.16)}.hero h1{font-size:34px;letter-spacing:-.04em;line-height:1.05;margin-bottom:10px}.hero p{color:rgba(250,246,240,.75);font-size:14px;line-height:1.55;max-width:650px}.needle{background:rgba(44,36,23,.42);border:1px solid rgba(250,246,240,.15);border-radius:16px;padding:18px;position:relative;z-index:1}.needle .k{font-size:11px;color:var(--tan);text-transform:uppercase;letter-spacing:.12em;font-weight:900}.needle .v{font-size:24px;font-weight:900;margin:8px 0}.needle .s{font-size:12px;color:rgba(250,246,240,.66);line-height:1.4}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(44,36,23,.04)}.card.dark{background:var(--bark);color:var(--cream);border-color:var(--bark)}.card h2,.card-title{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900;margin-bottom:14px}.dark .card-title,.dark h2{color:rgba(250,246,240,.48)}.metric .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:850;margin-bottom:8px}.metric .value{font-size:27px;font-weight:900;letter-spacing:-.04em}.metric .note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}.green{color:var(--ok)!important}.amber{color:var(--amber)!important}.red{color:var(--red)!important}.blue{color:var(--blue)!important}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(116,107,96,.14);font-size:13px}.row:last-child{border-bottom:0}.row .left{min-width:0}.row .name{font-weight:800}.row .meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}.status{font-size:11px;border-radius:999px;padding:3px 8px;font-weight:900;white-space:nowrap}.s-ok{background:#E4F2EA;color:#12633C}.s-warn{background:#FFF1D8;color:#754807}.s-block{background:#FBE4E0;color:#8E2E22}.s-info{background:#E5F0F7;color:#194B70}.tasks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.task{border:1px solid var(--line);background:white;border-radius:14px;padding:14px}.task .prio{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:8px}.task .txt{font-size:14px;font-weight:850;line-height:1.35}.task .due{font-size:11px;color:var(--muted);margin-top:8px}.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.col{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;padding:14px}.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}.mini{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.mini b{font-size:13px}.mini p{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.quick button{text-align:left;align-items:flex-start;justify-content:flex-start;min-height:84px;flex-direction:column}.quick strong{font-size:14px}.quick span{font-weight:500;color:var(--muted);line-height:1.35}.modal{display:none;position:fixed;inset:0;background:rgba(23,20,17,.72);z-index:10;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-box{background:var(--paper);border-radius:18px;max-width:720px;width:100%;padding:20px;border:1px solid var(--line)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modal textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:white}.response{margin-top:14px;background:white;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.55}.source{font-size:11px;color:var(--muted);margin-top:16px}.list{padding-left:18px;color:var(--muted);font-size:13px;line-height:1.7}.list b{color:var(--ink)}.loading{padding:28px;color:var(--muted)}@media(max-width:1000px){.sidebar{display:none}.hero{grid-template-columns:1fr}.grid4,.grid3,.grid2,.tasks,.kanban,.quick{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="brand"><span>Maintane</span> Mission Control</div><div class="sub" id="appSubtitle">Blessopher Capital operating cockpit</div></div>
    <nav class="nav">
      <div class="nav-label">Launch</div>
      <div class="nav-item active" data-page="overview">🏠 Overview</div>
      <div class="nav-item" data-page="blockers">🚧 Blockers</div>
      <div class="nav-item" data-page="channels">🛒 Channels</div>
      <div class="nav-item" data-page="influencers">🤝 Influencers</div>
      <div class="nav-label">Growth</div>
      <div class="nav-item" data-page="content">📲 Content</div>
      <div class="nav-item" data-page="finance">💵 Unit Economics</div>
      <div class="nav-item" data-page="tom">🧠 Tom</div>
    </nav>
    <div class="side-foot"><span class="dot"></span>Tom online<br><span id="sourceLabel" style="font-size:11px;color:rgba(250,246,240,.42)">Source: mission-control.json</span></div>
  </aside>
  <main class="main">
    <div class="topbar"><div class="title" id="pageTitle">Overview</div><div class="top-actions"><span class="pill" id="updatedLabel">Loading...</span><a class="btn" id="siteLink" href="https://getmaintane.com" target="_blank">Site</a><button class="primary" onclick="askTom('Give me the Maintane launch command list for tomorrow morning. Be blunt and prioritize by cash impact.')">Ask Tom</button></div></div>
    <div class="content" id="app"><div class="loading">Loading mission-control.json...</div></div>
  </main>
</div>
<div class="modal" id="tomModal"><div class="modal-box"><div class="modal-head"><b>Ask Tom</b><button onclick="closeTom()">Close</button></div><textarea id="tomPrompt" placeholder="Ask Tom for a recommendation..."></textarea><div style="margin-top:10px;display:flex;gap:10px"><button class="primary" onclick="sendTom()">Send</button><button onclick="document.getElementById('tomPrompt').value=''">Clear</button></div><div class="response" id="tomResponse">Ready.</div></div></div>
<script>
const titles={overview:'Overview',blockers:'Launch Blockers',channels:'Channel Status',influencers:'Influencer Pipeline',content:'Content Queue',finance:'Unit Economics',tom:'Tom'};
let missionData=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const tone=t=>t?esc(t):'';
const metric=m=>`<div class="card metric"><div class="label">${esc(m.label)}</div><div class="value ${tone(m.tone)}">${esc(m.value)}</div><div class="note">${esc(m.note)}</div></div>`;
const row=([label,value,status])=>`<div class="row"><span>${esc(label)}</span>${status?`<span class="status s-${esc(status)}">${esc(value)}</span>`:`<b>${esc(value)}</b>`}</div>`;
const badgeTone=t=>({ok:'ok',warn:'warn',block:'block',info:'info'}[t]||'info');
const rec=r=>`<div class="row"><div><div class="name">${esc(r.title||r.name)}</div><div class="meta">${esc(r.meta)}</div></div><span class="status s-${badgeTone(r.tone)}">${esc(r.badge)}</span></div>`;
const list=items=>`<ul class="list">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
function render(data){missionData=data;document.title=data.meta.title;document.getElementById('appSubtitle').textContent=data.meta.subtitle;document.getElementById('updatedLabel').textContent=data.meta.updatedLabel;document.getElementById('siteLink').href=data.meta.siteUrl;document.getElementById('sourceLabel').textContent=`Source: ${data.meta.source} → mission-control.json`;
  document.getElementById('app').innerHTML=`
<section class="page active" id="overview"><div class="hero"><div><h1>${esc(data.hero.headline)}</h1><p>${esc(data.hero.body)}</p></div><div class="needle"><div class="k">${esc(data.hero.needleLabel)}</div><div class="v">${esc(data.hero.needleValue)}</div><div class="s">${esc(data.hero.needleSupport)}</div></div></div><div class="grid4">${data.overviewMetrics.map(metric).join('')}</div><div class="quick">${data.quickActions.map(a=>`<button onclick="askTom('${esc(a.prompt)}')"><strong>${esc(a.title)}</strong><span>${esc(a.description)}</span></button>`).join('')}</div><div class="grid2"><div class="card"><div class="card-title">Critical path — next 12 hours</div><div class="tasks">${data.criticalTasks.map(t=>`<div class="task"><div class="prio ${tone(t.tone)}">${esc(t.priority)}</div><div class="txt">${esc(t.text)}</div><div class="due">${esc(t.due)}</div></div>`).join('')}</div></div><div class="card dark"><div class="card-title">Tom recommendation</div>${data.recommendations.map(rec).join('')}</div></div></section>
<section class="page" id="blockers"><div class="grid4">${data.blockers.metrics.map(metric).join('')}</div><div class="kanban">${data.blockers.columns.map(c=>`<div class="col"><h3>${esc(c.title)}</h3>${c.cards.map(card=>`<div class="mini"><b>${esc(card.title)}</b><p>${esc(card.body)}</p></div>`).join('')}</div>`).join('')}</div></section>
<section class="page" id="channels"><div class="grid3">${data.channels.map(c=>`<div class="card"><div class="card-title">${esc(c.title)}</div>${c.rows.map(row).join('')}</div>`).join('')}</div></section>
<section class="page" id="influencers"><div class="grid4">${data.influencers.metrics.map(metric).join('')}</div><div class="grid2"><div class="card"><div class="card-title">Priority contacts</div>${data.influencers.priorityContacts.map(rec).join('')}</div><div class="card"><div class="card-title">Outreach rules</div>${list(data.influencers.outreachRules)}</div></div></section>
<section class="page" id="content"><div class="grid3">${data.content.metrics.map(metric).join('')}</div><div class="grid2"><div class="card"><div class="card-title">Content pillars</div>${data.content.pillars.map(row).join('')}</div><div class="card"><div class="card-title">Creative rules</div>${list(data.content.creativeRules)}</div></div></section>
<section class="page" id="finance"><div class="grid4">${data.finance.metrics.map(metric).join('')}</div><div class="grid2"><div class="card"><div class="card-title">Price ladder</div>${data.finance.priceLadder.map(row).join('')}</div><div class="card"><div class="card-title">Consumer angle</div>${data.finance.consumerAngle.map(row).join('')}</div></div></section>
<section class="page" id="tom"><div class="grid2"><div class="card"><div class="card-title">Tom command center</div><p style="color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:14px">${esc(data.tom.description)}</p><button class="primary" onclick="askTom('${esc(data.tom.statusPrompt)}')">Get status update</button></div><div class="card"><div class="card-title">Data source</div>${data.tom.dataSourceRows.map(row).join('')}<p class="source">${esc(data.tom.sourceNote)}</p></div></div></section>`;
}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));document.getElementById(id)?.classList.add('active');document.querySelector(`[data-page="${id}"]`)?.classList.add('active');document.getElementById('pageTitle').textContent=titles[id]||id;}
document.querySelectorAll('.nav-item').forEach(item=>item.addEventListener('click',()=>showPage(item.dataset.page)));
function askTom(prompt){document.getElementById('tomModal').classList.add('open');document.getElementById('tomPrompt').value=prompt;document.getElementById('tomResponse').textContent='Ready.';}
function closeTom(){document.getElementById('tomModal').classList.remove('open');}
async function sendTom(){const message=document.getElementById('tomPrompt').value.trim();if(!message)return;const out=document.getElementById('tomResponse');out.textContent='Thinking...';try{const res=await fetch('/.netlify/functions/tom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await res.json();out.textContent=data.reply||data.error||'No reply.';}catch(e){out.textContent='Tom function unavailable: '+e.message;}}
fetch('mission-control.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return r.json();}).then(render).catch(e=>{document.getElementById('app').innerHTML=`<div class="card"><div class="card-title">Data load failed</div><p class="source">${esc(e.message)}</p></div>`;console.error('mission-control.json load failed',e);});
</script>
</body>
</html>
